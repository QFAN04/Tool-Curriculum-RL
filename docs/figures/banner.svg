<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560">
  <defs>
    <style>
      .hand { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', 'Segoe Print', cursive; }
      .chunky { font-family: 'Arial Rounded MT Bold', 'Nunito', 'Varela Round', 'Arial Black', 'Helvetica Neue', sans-serif; font-weight: 900; }
      .ink { stroke: #1d1d1f; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <!-- Schema / tool card icon -->
    <g id="toolcard">
      <rect width="54" height="62" rx="8" fill="#ffffff" class="ink" stroke-width="3.5"/>
      <rect x="9" y="10" width="36" height="8" rx="3" fill="#4fb3a9"/>
      <rect x="9" y="25" width="28" height="4" rx="2" fill="#b7c0cf"/>
      <rect x="9" y="34" width="34" height="4" rx="2" fill="#b7c0cf"/>
      <rect x="9" y="43" width="22" height="4" rx="2" fill="#b7c0cf"/>
    </g>
    <g id="ok">
      <circle r="17" fill="#2fb67c" class="ink" stroke-width="3.5"/>
      <path d="M-8 0 l5.5 6 l10 -12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="no">
      <circle r="17" fill="#ef5b5b" class="ink" stroke-width="3.5"/>
      <path d="M-6.5 -6.5 l13 13 M6.5 -6.5 l-13 13" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Background card -->
  <rect x="8" y="8" width="1264" height="544" rx="28" fill="#e9e6df"/>
  <rect x="4" y="4" width="1264" height="544" rx="28" fill="#fbfaf6" class="ink" stroke-width="4"/>

  <!-- ================= Mascot ================= -->
  <g transform="translate(46 26)">
    <ellipse cx="112" cy="246" rx="70" ry="9" fill="#1d1d1f" fill-opacity="0.12"/>
    <!-- Antenna -->
    <line x1="110" y1="22" x2="110" y2="50" class="ink" stroke-width="5"/>
    <circle cx="110" cy="17" r="10" fill="#e76f51" class="ink" stroke-width="4"/>
    <!-- Left arm + schema card -->
    <path d="M72 180 Q48 196 44 214" fill="none" class="ink" stroke-width="17"/>
    <path d="M72 180 Q48 196 44 214" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <g transform="rotate(-14 34 214)">
      <rect x="10" y="190" width="46" height="54" rx="6" fill="#ffb347" class="ink" stroke-width="4"/>
      <rect x="18" y="199" width="30" height="12" rx="3" fill="#fff4dd" class="ink" stroke-width="2.5"/>
      <line x1="19" y1="221" x2="46" y2="221" stroke="#6c4b16" stroke-width="3" stroke-linecap="round"/>
      <line x1="19" y1="231" x2="39" y2="231" stroke="#6c4b16" stroke-width="3" stroke-linecap="round"/>
    </g>
    <circle cx="44" cy="214" r="11" fill="#ffffff" class="ink" stroke-width="4"/>
    <!-- Body -->
    <rect x="62" y="152" width="96" height="84" rx="28" fill="#4fb3a9" class="ink" stroke-width="5"/>
    <circle cx="110" cy="194" r="19" fill="#ffffff" class="ink" stroke-width="3.5"/>
    <text x="110" y="201" class="chunky" font-size="17" fill="#2a9d8f" text-anchor="middle">TC</text>
    <!-- Head -->
    <rect x="42" y="48" width="136" height="108" rx="46" fill="#ffffff" class="ink" stroke-width="5"/>
    <rect x="60" y="68" width="100" height="62" rx="27" fill="#1f2547" class="ink" stroke-width="3"/>
    <path d="M78 104 q11 -15 22 0" fill="none" stroke="#5fe0c4" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M120 104 q11 -15 22 0" fill="none" stroke="#5fe0c4" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Right arm (raised) -->
    <path d="M154 176 Q186 160 196 134" fill="none" class="ink" stroke-width="17"/>
    <path d="M154 176 Q186 160 196 134" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <!-- Cartoon wrench held in right hand -->
    <g transform="translate(198 130) rotate(28)">
      <!-- Wrench handle -->
      <rect x="-7" y="-58" width="14" height="86" rx="7" fill="#d9e3f0" class="ink" stroke-width="4"/>
      <line x1="-2" y1="-44" x2="-2" y2="14" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <!-- Open-end wrench head with jaw cutout -->
      <path d="M-19 -62 C-24 -79 -14 -94 -5 -95 L-5 -76 L6 -76 L6 -95 C15 -94 24 -79 19 -62 C15 -53 7 -50 0 -50 C-7 -50 -15 -53 -19 -62 Z" fill="#cfe2f7" class="ink" stroke-width="4.5"/>
    </g>
    <!-- Hand overlapping wrench handle -->
    <circle cx="198" cy="130" r="13" fill="#ffffff" class="ink" stroke-width="4"/>
  </g>

  <!-- ================= Title & Meta ================= -->
  <g class="chunky" font-size="66" letter-spacing="-1">
    <text x="330" y="122" fill="#1d1d1f" fill-opacity="0.16">ToolCurriculum-RL</text>
    <text x="326" y="118"><tspan fill="#2a9d8f">Tool</tspan><tspan fill="#e76f51">Curriculum</tspan><tspan fill="#1d1d1f">-RL</tspan></text>
  </g>
  <text x="328" y="164" class="hand" font-size="25" fill="#1d1d1f" font-weight="700">After LoRA SFT, what helps a 4B model solve new tool tasks?</text>
  <text x="328" y="200" class="hand" font-size="16.5" fill="#5c6270">LoRA SFT · GRPO · SDPO · Failure-Driven Curriculum · Qwen3-4B-Base · Toucan / Conversion / BFCL</text>

  <!-- Task example pill -->
  <g>
    <rect x="328" y="220" width="908" height="42" rx="21" fill="#ffffff" class="ink" stroke-width="3"/>
    <text x="348" y="247" class="hand" font-size="16" fill="#1d1d1f">Task: “Book 2h at 15% off ($40/hr)” → infer (120m, $68) → lookup_slot → set_rate · set_qty</text>
  </g>

  <!-- ================= Four Panels ================= -->
  <text x="40" y="298" class="hand" font-size="16" fill="#5c6270">How four post-training paths behave on literal (D12) vs. implicit-conversion (D9/D10) tasks:</text>

  <!-- Panel 1: E0 · LoRA SFT -->
  <g transform="translate(40 312)">
    <rect x="5" y="5" width="288" height="222" rx="20" fill="#d9dee8"/>
    <rect width="288" height="222" rx="20" fill="#eaf2ff" class="ink" stroke-width="4"/>
    <text x="20" y="36" class="hand" font-size="21" font-weight="700" fill="#2a78d6">E0 · LoRA SFT</text>
    <text x="20" y="58" class="hand" font-size="14.5" fill="#5c6270">“the literal learner”</text>
    <!-- Literal vs conversion cards -->
    <g transform="translate(42 74)">
      <rect width="84" height="72" rx="9" fill="#ffffff" class="ink" stroke-width="3"/>
      <text x="42" y="24" class="hand" font-size="13" fill="#5c6270" text-anchor="middle">literal</text>
      <text x="42" y="45" class="chunky" font-size="15" fill="#1d1d1f" text-anchor="middle">$40 → 40</text>
      <circle cx="42" cy="60" r="8" fill="#2fb67c"/>
      <path d="M38 60 l3 3 l5 -6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(154 74)">
      <rect width="88" height="72" rx="9" fill="#ffffff" class="ink" stroke-width="3"/>
      <text x="44" y="24" class="hand" font-size="13" fill="#5c6270" text-anchor="middle">15% off?</text>
      <text x="44" y="46" class="chunky" font-size="15" fill="#e76f51" text-anchor="middle">61.48%</text>
      <text x="44" y="64" class="hand" font-size="12" fill="#8b95a8" text-anchor="middle">241 / 392</text>
    </g>
    <use href="#ok" x="34" y="190"/>
    <text x="60" y="196" class="hand" font-size="14" fill="#1d1d1f">94.25% D12 unseen, weak math</text>
  </g>

  <!-- Panel 2: Graded GRPO -->
  <g transform="translate(343 312)">
    <rect x="5" y="5" width="288" height="222" rx="20" fill="#e8ddd6"/>
    <rect width="288" height="222" rx="20" fill="#fff0e8" class="ink" stroke-width="4"/>
    <text x="20" y="36" class="hand" font-size="21" font-weight="700" fill="#e76f51">Graded GRPO</text>
    <text x="20" y="58" class="hand" font-size="14.5" fill="#5c6270">“the partial scorer”</text>
    <!-- 3 call chips: 2 green + 1 failed rate -->
    <g transform="translate(32 82)">
      <rect width="64" height="58" rx="8" fill="#ffffff" class="ink" stroke-width="3"/>
      <text x="32" y="24" class="hand" font-size="12" fill="#5c6270" text-anchor="middle">call 1</text>
      <path d="M24 41 l6 6 l11 -13" fill="none" stroke="#2fb67c" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(108 82)">
      <rect width="64" height="58" rx="8" fill="#ffffff" class="ink" stroke-width="3"/>
      <text x="32" y="24" class="hand" font-size="12" fill="#5c6270" text-anchor="middle">call 2</text>
      <path d="M24 41 l6 6 l11 -13" fill="none" stroke="#2fb67c" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(184 82)">
      <rect width="68" height="58" rx="8" fill="#ffffff" class="ink" stroke-width="3" stroke-dasharray="5 3"/>
      <text x="34" y="24" class="hand" font-size="12" fill="#e76f51" text-anchor="middle">rate $</text>
      <path d="M27 34 l14 14 M41 34 l-14 14" stroke="#ef5b5b" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- Score pill 0.80 -->
    <rect x="86" y="148" width="112" height="22" rx="11" fill="#ffd8c2" class="ink" stroke-width="2.5"/>
    <text x="142" y="164" class="hand" font-size="12.5" font-weight="700" fill="#a84128" text-anchor="middle">reward = 0.80!</text>
    <use href="#no" x="34" y="190"/>
    <text x="60" y="196" class="hand" font-size="14" fill="#1d1d1f">295/392 conv (-41 vs binary)</text>
  </g>

  <!-- Panel 3: Binary GRPO & SDPO -->
  <g transform="translate(646 312)">
    <rect x="5" y="5" width="288" height="222" rx="20" fill="#d6e6df"/>
    <rect width="288" height="222" rx="20" fill="#e9f8f1" class="ink" stroke-width="4"/>
    <text x="20" y="36" class="hand" font-size="21" font-weight="700" fill="#1f9d6b">Binary GRPO · SDPO</text>
    <text x="20" y="58" class="hand" font-size="14.5" fill="#5c6270">“the strict verifier”</text>
    <!-- Strict 0/1 gate + gold feedback card -->
    <g transform="translate(30 78)">
      <rect width="94" height="68" rx="10" fill="#ffffff" class="ink" stroke-width="3"/>
      <text x="47" y="26" class="chunky" font-size="18" fill="#1f9d6b" text-anchor="middle">{0, 1}</text>
      <text x="47" y="45" class="hand" font-size="12.5" fill="#5c6270" text-anchor="middle">all-or-none</text>
      <text x="47" y="60" class="hand" font-size="12" fill="#1f9d6b" text-anchor="middle">no shortcuts</text>
    </g>
    <path d="M132 112 h18" fill="none" class="ink" stroke-width="3.5"/>
    <path d="M144 106 l8 6 l-8 6" fill="none" class="ink" stroke-width="3.5"/>
    <g transform="translate(158 78)">
      <rect width="102" height="68" rx="10" fill="#ffffff" class="ink" stroke-width="3"/>
      <text x="51" y="25" class="hand" font-size="12" font-weight="700" fill="#1f9d6b" text-anchor="middle">gold feedback</text>
      <rect x="16" y="35" width="70" height="8" rx="3" fill="#bcebd6"/>
      <rect x="16" y="49" width="50" height="8" rx="3" fill="#bcebd6"/>
    </g>
    <use href="#ok" x="34" y="190"/>
    <text x="60" y="196" class="hand" font-size="13.5" fill="#1d1d1f">D12 95.76% · 336/392 conv</text>
  </g>

  <!-- Panel 4: C-F · failure curriculum -->
  <g transform="translate(949 312)">
    <rect x="5" y="5" width="288" height="222" rx="20" fill="#ebe2cc"/>
    <rect width="288" height="222" rx="20" fill="#fff7e0" class="ink" stroke-width="4"/>
    <text x="20" y="36" class="hand" font-size="21" font-weight="700" fill="#c98500">C-F · curriculum</text>
    <text x="20" y="58" class="hand" font-size="14.5" fill="#5c6270">“the targeted driller”</text>
    <!-- Failed seed -> curved loop -> verified conversion card -->
    <g transform="translate(34 84)">
      <rect width="62" height="54" rx="8" fill="#ffffff" class="ink" stroke-width="3"/>
      <text x="31" y="21" class="hand" font-size="12" fill="#5c6270" text-anchor="middle">failed</text>
      <circle cx="31" cy="38" r="10" fill="#ef5b5b"/>
      <path d="M27 34 l8 8 M35 34 l-8 8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <path d="M104 96 Q134 72 162 96" fill="none" stroke="#c98500" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M156 89 l8 7 l-10 3" fill="none" stroke="#c98500" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="134" y="132" class="hand" font-size="12" fill="#a86d00" text-anchor="middle">360/360</text>
    <text x="134" y="147" class="hand" font-size="12" fill="#a86d00" text-anchor="middle">mixed</text>
    <g transform="translate(172 78)">
      <rect width="84" height="68" rx="9" fill="#ffffff" class="ink" stroke-width="3"/>
      <rect x="10" y="12" width="64" height="12" rx="3" fill="#ffd23f"/>
      <text x="42" y="41" class="hand" font-size="12.5" font-weight="700" fill="#1d1d1f" text-anchor="middle">% / units</text>
      <text x="42" y="58" class="hand" font-size="12" fill="#2fb67c" text-anchor="middle">verified ✓</text>
    </g>
    <use href="#ok" x="34" y="190"/>
    <text x="60" y="196" class="hand" font-size="14" fill="#1d1d1f">337/392 conv (+32 vs C-U)</text>
  </g>
</svg>
